spring.application.name=plateforme-benevolat
server.port=${SERVER_PORT:8080}

# Base de données MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/benevolat_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.open-in-view=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:CHANGE_ME_SECRET_KEY_MIN_32_CHARS}
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}

# Email (OTP / Réinitialisation de mot de passe) - configuration Gmail SMTP
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=*

# Durée de validité de l'OTP (1 minute)
otp.expiration.minutes=${OTP_EXPIRATION_MINUTES:1}

# reCAPTCHA Google
recaptcha.secret.key=${RECAPTCHA_SECRET:}

# URL du frontend (pour les liens dans les emails)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Cloudinary (upload images et PDFs certificats)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.upload-preset=${CLOUDINARY_UPLOAD_PRESET:benevolat_preset}

# n8n : workflows rédigés par l'IA (rappel 24 h, renfort urgent, résumé hebdomadaire).
# Base des webhooks (ex. http://localhost:5678/webhook) + secret partagé (en-tête X-Webhook-Secret,
# dans les deux sens). Si vide, n8n est désactivé et le backend envoie les rappels lui-même.
n8n.base-url=${N8N_BASE_URL:}
n8n.secret=${N8N_WEBHOOK_SECRET:}

# Google Gemini : scores de recommandation calculés par l'IA (clé gratuite sur aistudio.google.com).
# Si vide, les recommandations utilisent la formule pondérée de secours.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-flash-latest}

# Compte administrateur créé au premier démarrage s'il n'en existe aucun
app.admin.email=${ADMIN_EMAIL:admin@countmein.ma}
app.admin.password=${ADMIN_PASSWORD:Admin@CountMeIn2026}

# Renvoie le message des ResponseStatusException au frontend (affiché dans les toasts)
server.error.include-message=always
