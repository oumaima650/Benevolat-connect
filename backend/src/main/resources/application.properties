spring.application.name=plateforme-benevolat
server.port=${SERVER_PORT:8080}

# Base de données MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/benevolat_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.open-in-view=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:CHANGE_ME_SECRET_KEY_MIN_32_CHARS}
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}

# Email (OTP / Réinitialisation de mot de passe) - configuration Gmail SMTP
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Durée de validité de l'OTP (1 minute)
otp.expiration.minutes=${OTP_EXPIRATION_MINUTES:1}

# reCAPTCHA Google
recaptcha.secret.key=${RECAPTCHA_SECRET:}