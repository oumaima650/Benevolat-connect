spring.application.name=plateforme-benevolat
server.port=8080

# Base de données MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/benevolat_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
# Le mot de passe est lu depuis la variable d'environnement DB_PASSWORD (vide par défaut)
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.open-in-view=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true